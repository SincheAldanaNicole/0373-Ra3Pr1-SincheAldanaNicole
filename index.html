<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>0373-Ra3Pr1-SincheAldan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulari de notes d'alumnes</h1>
    <form id="formulari-notes">
        <div class="control-formulari">
            <label for="nom">Nom de l'alumne:</label>
            <input type="text" id="nom">
        </div>
        <div class="control-formulari">
            <label for="examen">Nota Examen (60%):</label>
            <input type="number" id="examen" step="0.01">
        </div>
        <div class="control-formulari">
            <label for="practiques">Nota Pràctiques (30%):</label>
            <input type="number" id="practiques" step="0.01">
        </div>
        <div class="control-formulari">
            <label for="actitud">Nota Actitud (10%):</label>
            <input type="number" id="actitud" step="0.01">
        </div>
        <button type="submit" id="btn-afegir">Afegir Alumne</button>
    </form>
    <div id="missatges-error"></div>
    <hr>
    <div class="accions-taula">
        <button onclick="ordenarAlumnes('desc')">Major a Menor</button>
        <button onclick="ordenarAlumnes('asc')">Menor a Major</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Nota Final</th>
                <th>Estat</th>
            </tr>
        </thead>
        <tbody id="cos-taula">
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
